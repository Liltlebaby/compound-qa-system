name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qa_ci
          POSTGRES_PASSWORD: qa_ci_test_only
          POSTGRES_DB: qa_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa_ci -d qa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://qa_ci:qa_ci_test_only@127.0.0.1:5432/qa_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/package-release.mjs "${GITHUB_REF_NAME}"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: qa-release
          path: release-artifacts/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-release
          path: release-artifacts
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QA_TAG: ${{ github.ref_name }}
        run: gh release create "$QA_TAG" release-artifacts/* --verify-tag --title "$QA_TAG" --notes "COMPOUND QA release. Back up production data before manually updating the server."
